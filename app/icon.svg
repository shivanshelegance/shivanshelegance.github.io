<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0.157" y1="0.864" x2="0.843" y2="0.136">
      <stop offset="0" stop-color="#E0AF53"/>
      <stop offset="0.5" stop-color="#F2C86D"/>
      <stop offset="1" stop-color="#EFC469"/>
    </linearGradient>
  </defs>

  <!-- espresso ground, matching the site header -->
  <rect width="64" height="64" rx="14" fill="#120D08"/>
  <rect x="1.8" y="1.8" width="60.4" height="60.4" rx="12.4"
        fill="none" stroke="url(#gold)" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- crown: the brand motif from the wordmark -->
  <g fill="url(#gold)">
    <path d="M14.6 30.2V15.8l8.1 5.9L32 11.6l9.3 10.1 8.1-5.9v14.4z"/>
    <rect x="14.6" y="31.2" width="34.8" height="3.2" rx="1.6"/>
  </g>

  <!-- SE monogram -->
  <text x="32" y="52" text-anchor="middle"
        font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="19" font-weight="600" letter-spacing="0.4"
        fill="url(#gold)">SE</text>
</svg>
